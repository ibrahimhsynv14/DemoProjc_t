                    </div>
                    <div class="btn">

            </div>

    </div>
    <script>
        const products = [

]
        const addBtn = document.querySelector('#addBtn')
        const modal = document.querySelector('#productModal')
        const close = document.querySelector('.close')
        const modalName = document.querySelector('#modalName')
        const cartbody = document.querySelector('.cartbody')
        const h2 = document.querySelector('#user')
        const shoppinCart = []
        h2.textContent ='Hello ' + localStorage.getItem('name')

        function show(){
            products.forEach(item => {
                const cart = document.createElement('div')
                cart.innerHTML = `
                    <div class="cart">
                        <img src="${item.imgUrl}" alt="">
                        <div class="info">
                            <p class="name">${item.name}</p>
                            <p class="price">${item.price}$</p>
                            <button id="addBtn" class="addBtn" onclick="addToCart(${item.id})">Add to cart 🛒</button>
                        </div>
                    </div>
                `
                cartbody.append(cart)

                
            })            
        }

        function openmodal(product){
            cart.addEventListener('click', (event) => {
                if(event.target.classList.contains("addBtn")){return}
                document.querySelector('#modalImg').src = item.imgUrl
                document.querySelector('#modalName').textContent = item.name
                document.querySelector('#modalPrice').textContent = item.price + '$'
                document.querySelector('#modalDescription').textContent ='Feedbacks:' + item.feedback
                document.querySelector('#count').textContent ='Count:' + item.count
                document.querySelector('#count').style.color = item.count < 10 ? 'red' : 'black'
                document.querySelector('#productModal').style.display = 'flex'
            })
        }

        close.addEventListener('click', () => {
            modal.style.display = 'none'
        })

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none'
            }
        })

        function addToCart(id){
            const product = products.find(item=>item.id === id)
            shoppinCart.push(product)
            console.log(shoppinCart)
        }

        show()
    </script>
</body>
